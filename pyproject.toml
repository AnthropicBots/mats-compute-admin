[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mats-compute-admin"
version = "0.1.0"
description = "Compute resource administration system for MATS Research fellows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Mohit", email = "mohit@example.com"},
]
keywords = ["hpc", "slurm", "compute", "administration", "ai-safety", "mats"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Systems Administration",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []   # zero mandatory deps — stdlib only for core

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]
airtable = ["pyairtable>=2.3"]
slack    = ["slack-sdk>=3.27"]
cloud    = ["boto3>=1.34", "google-cloud-storage>=2.16"]

[project.scripts]
mats-admin = "compute_admin.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line length handled by formatter
